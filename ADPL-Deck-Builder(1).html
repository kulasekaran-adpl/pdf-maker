            // Extra-tall row larger than a single page: split row across pages cleanly
            let startLn = 0;
            while (startLn < rl.maxLines){
              let fitLns = Math.floor((curSheet.bodyH - y - cellPadY * 2 + 0.01) / cellLh);
              if (fitLns < 1){
                nextPage();
                emitRowSlice(headLayout, 0, headLayout.maxLines, TABLE_HEAD_BG, true);
                fitLns = Math.max(1, Math.floor((curSheet.bodyH - y - cellPadY * 2 + 0.01) / cellLh));
              }
              const take = Math.min(fitLns, rl.maxLines - startLn);
              emitRowSlice(rl, startLn, take, bg, false);
              startLn += take;
              if (startLn < rl.maxLines){
                nextPage();
                emitRowSlice(headLayout, 0, headLayout.maxLines, TABLE_HEAD_BG, true);
              }
            }
          });

          y += 3.0;
          continue;
        }

        if (b.type === 'hr'){
          if (atTop()) continue;
          if (y + 8 > curSheet.bodyH){
            nextPage();
            continue;
          }
          y += 2.0;
          curSheet.ops.push({ op:'line', x1: x, y1: y, x2: x + w, y2: y, color: LINE, lineW: 0.3 });
          y += 3.2;
          continue;
        }

        if (b.type === 'html'){
          const raw = String(b.text || b.raw || '').trim();
          if (PAGEBREAK_RE.test(raw)){
            if (!atTop()) nextPage();
          } else if (/^<hr\s*\/?>$/i.test(raw)){
            if (!atTop()){
              y += 2.0;
              curSheet.ops.push({ op:'line', x1: x, y1: y, x2: x + w, y2: y, color: LINE, lineW: 0.3 });
              y += 3.2;
            }
          } else if (/^<br\s*\/?>$/i.test(raw)){
            if (!atTop()) y += BODY_LH * 0.7;
          } else if (!/^<!--[\s\S]*-->$/.test(raw)){
            const stripped = cleanControlChars(decodeEntities(raw.replace(/<[^>]+>/g, ' '))).replace(/\s+/g, ' ').trim();
            if (stripped){
              layoutBlocks([{ type:'paragraph', text: stripped, tokens:[{ type:'text', text: stripped }] }], x, w, ctx);
            }
          }
          continue;
        }
      }
    }

    if (ast.length === 0){
      curSheet.isEmpty = true;
    } else {
      layoutBlocks(ast, 0, curSheet.bodyW, { listDepth: 0, tightList: false, inQuote: false });
      if (sheets.length === 1 && curSheet.ops.length === 0){
        curSheet.isEmpty = true;
      }
      // Drop accidental trailing empty sheet if explicit pagebreak was at very end
      while (sheets.length > 1 && sheets[sheets.length - 1].ops.length === 0){
        sheets.pop();
      }
    }

    const partCount = sheets.length;
    sheets.forEach((sh, i)=>{
      sh.partCount = partCount;
      if (i > 0){
        sh.step = baseStep ? `${baseStep} · Cont. (${i+1}/${partCount})` : `Cont. (${i+1}/${partCount})`;
      } else {
        sh.step = baseStep;
      }
    });
    return sheets;
  }

  // ---------- Render ops -> SVG (Live Preview) ----------
  function n2(v){ return Math.round(v * 100) / 100; }

  function opsToSvgHtml(ops, bodyW, bodyH){
    const parts = [
      `<svg class="md-svg" viewBox="0 0 ${n2(bodyW)} ${n2(bodyH)}" preserveAspectRatio="xMinYMin meet" xmlns="http://www.w3.org/2000/svg">`
    ];
    for (const o of ops){
      if (o.op === 'rect'){
        const fill = o.fill ? rgbCss(o.fill) : 'none';
        const stroke = o.stroke ? rgbCss(o.stroke) : 'none';
        const sw = o.stroke ? n2(o.lineW || 0.25) : 0;
        const rx = o.r ? ` rx="${n2(o.r)}" ry="${n2(o.r)}"` : '';
        parts.push(`<rect x="${n2(o.x)}" y="${n2(o.y)}" width="${n2(o.w)}" height="${n2(o.h)}"${rx} fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
      } else if (o.op === 'line'){
        parts.push(`<line x1="${n2(o.x1)}" y1="${n2(o.y1)}" x2="${n2(o.x2)}" y2="${n2(o.y2)}" stroke="${rgbCss(o.color)}" stroke-width="${n2(o.lineW || 0.25)}" stroke-linecap="round"/>`);
      } else if (o.op === 'circle'){
        const fill = o.fill ? rgbCss(o.fill) : 'none';
        const stroke = o.stroke ? rgbCss(o.stroke) : 'none';
        const sw = o.stroke ? n2(o.lineW || 0.25) : 0;
        parts.push(`<circle cx="${n2(o.cx)}" cy="${n2(o.cy)}" r="${n2(o.r)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
      } else if (o.op === 'check'){
        parts.push(`<polyline points="${n2(o.x1)},${n2(o.y1)} ${n2(o.x2)},${n2(o.y2)} ${n2(o.x3)},${n2(o.y3)}" fill="none" stroke="${rgbCss(o.color)}" stroke-width="${n2(o.lineW || 0.4)}" stroke-linecap="round" stroke-linejoin="round"/>`);
      } else if (o.op === 'text'){
        const fsMm = n2(o.sizePt * PT_TO_MM);
        const fam = o.font === 'courier'
          ? "'Courier New', Courier, monospace"
          : "Helvetica, 'Liberation Sans', Arial, sans-serif";
        const fw = (o.style === 'bold' || o.style === 'bolditalic') ? '700' : '400';
        const fs = (o.style === 'italic' || o.style === 'bolditalic') ? 'italic' : 'normal';
        const tEl = `<text x="${n2(o.x)}" y="${n2(o.y)}" fill="${rgbCss(o.color)}" font-family="${fam}" font-size="${fsMm}" font-weight="${fw}" font-style="${fs}" xml:space="preserve" style="white-space:pre;">${escapeHtml(o.text)}</text>`;
        if (o.link){
          parts.push(`<a href="${escapeHtml(o.link)}" target="_blank" rel="noopener noreferrer">${tEl}</a>`);
        } else {
          parts.push(tEl);
        }
      }
    }
    parts.push('</svg>');
    return parts.join('');
  }

  // ---------- Replay ops -> jsPDF (Export) ----------
  function replayOpsToPdf(doc, ops, ox, oy){
    for (const o of ops){
      if (o.op === 'rect'){
        let mode = '';
        if (o.fill){ doc.setFillColor(...o.fill); mode += 'F'; }
        if (o.stroke){ doc.setDrawColor(...o.stroke); doc.setLineWidth(o.lineW || 0.25); mode += 'D'; }
        if (!mode) continue;
        if (o.r && o.r > 0){
          doc.roundedRect(ox + o.x, oy + o.y, o.w, o.h, o.r, o.r, mode);
        } else {
          doc.rect(ox + o.x, oy + o.y, o.w, o.h, mode);
        }
      } else if (o.op === 'line'){
        doc.setDrawColor(...o.color);
        doc.setLineWidth(o.lineW || 0.25);
        doc.line(ox + o.x1, oy + o.y1, ox + o.x2, oy + o.y2);
      } else if (o.op === 'circle'){
        let mode = '';
        if (o.fill){ doc.setFillColor(...o.fill); mode += 'F'; }
        if (o.stroke){ doc.setDrawColor(...o.stroke); doc.setLineWidth(o.lineW || 0.25); mode += 'S'; }
        if (mode) doc.circle(ox + o.cx, oy + o.cy, o.r, mode);
      } else if (o.op === 'check'){
        doc.setDrawColor(...o.color);
        doc.setLineWidth(o.lineW || 0.4);
        doc.line(ox + o.x1, oy + o.y1, ox + o.x2, oy + o.y2);
        doc.line(ox + o.x2, oy + o.y2, ox + o.x3, oy + o.y3);
      } else if (o.op === 'text'){
        drawSafePdfText(doc, o.text, ox + o.x, oy + o.y, {
          font: o.font, style: o.style, sizePt: o.sizePt, color: o.color, align: 'left'
        });
        if (o.link && typeof doc.link === 'function'){
          const em = o.sizePt * PT_TO_MM;
          try{
            doc.link(ox + o.x, oy + o.y - em * 0.82, Math.max(2, o.width || em), em * 1.1, { url: o.link });
          }catch(e){}
        }
      }
    }
  }

  // ---------- Unified Deck Layout Builder ----------
  function stepLabelFor(p, idx){
    if (!p.showStep) return '';
    return (p.stepLabel && p.stepLabel.trim()) ? p.stepLabel.trim() : `Step ${idx+1} of ${pages.length}`;
  }

  function buildDeckLayout(){
    const physicalSheets = [];
    const cardPageRanges = new Map();

    // Page 1: Cover
    physicalSheets.push({
      kind: 'cover',
      orientation: coverOrientation === 'landscape' ? 'landscape' : 'portrait',
      pageNum: 1
    });

    pages.forEach((p, idx)=>{
      const baseStep = stepLabelFor(p, idx);
      const startPage = physicalSheets.length + 1;
      if (p.type === 'screenshot'){
        physicalSheets.push({
          kind: 'screenshot',
          card: p,
          cardIdx: idx,
          orientation: p.orientation === 'landscape' ? 'landscape' : 'portrait',
          step: baseStep,
          pageNum: startPage
        });
        cardPageRanges.set(p.id, { start: startPage, end: startPage, count: 1 });
      } else {
        const textSheets = paginateTextCard(p, idx, baseStep);
        textSheets.forEach((ts)=>{
          ts.pageNum = physicalSheets.length + 1;
          physicalSheets.push(ts);
        });
        const endPage = physicalSheets.length;
        cardPageRanges.set(p.id, { start: startPage, end: endPage, count: textSheets.length });
      }
    });

    return {
      sheets: physicalSheets,
      totalPages: physicalSheets.length,
      cardPageRanges
    };
  }

  function updateFormPageLabels(deck){
    const layout = deck || buildDeckLayout();
    const heads = pagesListEl.querySelectorAll('.page-card-head');
    heads.forEach((head, idx)=>{
      const p = pages[idx];
      if (!p) return;
      const range = layout.cardPageRanges.get(p.id);
      const ptitleEl = head.querySelector('.ptitle');
      const pillEl = head.querySelector('.pages-pill');
      if (ptitleEl){
        const prefix = range
          ? (range.count > 1 ? `P.${range.start}–${range.end}` : `${range.start}.`)
          : `${idx + 2}.`;
        ptitleEl.textContent = `${prefix} ${p.title || 'Untitled page'}`;
      }
      if (pillEl){
        if (range && range.count > 1){
          pillEl.textContent = `${range.count} pages`;
          pillEl.classList.remove('hidden');
        } else {
          pillEl.textContent = '';
          pillEl.classList.add('hidden');
        }
      }
    });
  }

  // ---------- Live Preview rendering ----------
  function renderPreview(){
    const deck = buildDeckLayout();
    const total = deck.totalPages;
    updateFormPageLabels(deck);

    previewWrap.innerHTML = '';
    const extraAutoPages = total - (pages.length + 1);
    pageCountLabel.textContent = total + (total === 1 ? ' page' : ' pages') +
      (extraAutoPages > 0 ? ` (${extraAutoPages} auto-continued)` : '');

    const docCode = docCodeEl.value || 'AD-EC-000';
    const docTitle = docTitleEl.value || 'Untitled Deck';
    const footerBrand = `${docCodeEl.value || ''} | ${docTitleEl.value || ''}`;

    deck.sheets.forEach((sh)=>{
      if (sh.kind === 'cover'){
        const coverEl = document.createElement('div');
        coverEl.innerHTML = `<div class="sheet-label">Cover — ${sh.orientation} — Page 1 of ${total}</div>`;
        const sheet = document.createElement('div');
        sheet.className = 'sheet cover' + (sh.orientation === 'landscape' ? ' landscape' : '');
        sheet.style.position = 'relative';
        const tags = docTagsEl.value.trim();
        const maturity = docMaturityEl.value.trim();
        sheet.innerHTML = `
          <div class="doccode">${escapeHtml(docCode)}</div>
          <div class="ctitle">${escapeHtml(docTitle)}</div>
          <div class="csub">${escapeHtml(docSubtitleEl.value || '')}</div>
          ${tags ? `<div class="ctags">${escapeHtml(tags)}</div>` : ''}
          ${maturity ? `<div class="cmaturity">${escapeHtml(maturity)}</div>` : ''}
          <div class="sheet-footer" style="position:absolute; left:32px; right:32px; bottom:26px;">
            <div class="sf-left"><img src="${LOGO_DATA_URL}"/><span>${escapeHtml(footerBrand)}</span></div>
            <div class="sf-right">Page 1 of ${total}</div>
          </div>
        `;
        coverEl.appendChild(sheet);
        previewWrap.appendChild(coverEl);
        return;
      }

      const p = sh.card;
      const wrap = document.createElement('div');

      if (sh.kind === 'screenshot'){
        wrap.innerHTML = `<div class="sheet-label">Screenshot page — ${sh.orientation} — Page ${sh.pageNum} of ${total}</div>`;
        const s = document.createElement('div');
        s.className = 'sheet content' + (sh.orientation === 'landscape' ? ' landscape' : '');
        s.innerHTML = `
          <div class="cp-top">
            <div class="cp-eyebrow">${escapeHtml(p.eyebrow || '')}</div>
            ${sh.step ? `<div class="cp-step">${escapeHtml(sh.step)}</div>` : ''}
          </div>
          <div class="cp-title">${escapeHtml(p.title || '')}</div>
          <hr class="cp-rule"/>
          <div class="cp-imgbox ${p.imgData ? '' : 'empty'}">
            ${p.imgData ? `<img src="${p.imgData}"/>` : 'No screenshot uploaded yet'}
          </div>
          <div class="cp-caption">${escapeHtml(p.caption || '')}</div>
          <div class="sheet-footer">
            <div class="sf-left"><img src="${LOGO_DATA_URL}"/><span>${escapeHtml(footerBrand)}</span></div>
            <div class="sf-right">Page ${sh.pageNum} of ${total}</div>
          </div>
        `;
        wrap.appendChild(s);
        previewWrap.appendChild(wrap);
        return;
      }

      // Text page (1 or more auto-paginated sheets)
      const partTag = sh.partCount > 1 ? ` (Part ${sh.partIdx + 1} of ${sh.partCount})` : '';
      wrap.innerHTML = `<div class="sheet-label">Text page${partTag} — ${sh.orientation} — Page ${sh.pageNum} of ${total}</div>`;
      const s = document.createElement('div');
      s.className = 'sheet content text-sheet' +
        (sh.orientation === 'landscape' ? ' landscape' : '') +
        (sh.isContinuation ? ' is-cont' : '');

      const bodyHtml = sh.isEmpty
        ? `<div class="cp-body"><div class="cp-body-empty">Paste or type Markdown in the left panel</div></div>`
        : `<div class="cp-body">${opsToSvgHtml(sh.ops, sh.bodyW, sh.bodyH)}</div>`;

      if (!sh.isContinuation){
        const titleTrim = (p.title || '').trim();
        s.innerHTML = `
          <div class="cp-top">
            <div class="cp-eyebrow">${escapeHtml(p.eyebrow || '')}</div>
            ${sh.step ? `<div class="cp-step">${escapeHtml(sh.step)}</div>` : ''}
          </div>
          ${titleTrim ? `<div class="cp-title">${escapeHtml(titleTrim)}</div>` : ''}
          <hr class="cp-rule"/>
          ${bodyHtml}
          <div class="sheet-footer">
            <div class="sf-left"><img src="${LOGO_DATA_URL}"/><span>${escapeHtml(footerBrand)}</span></div>
            <div class="sf-right">Page ${sh.pageNum} of ${total}</div>
          </div>
        `;
      } else {
        const eyebrowTrim = (p.eyebrow || '').trim();
        const titleTrim = (p.title || '').trim();
        let leftHeader = escapeHtml(eyebrowTrim);
        if (titleTrim){
          leftHeader += `${eyebrowTrim ? ' ' : ''}<span class="cont-sec">${eyebrowTrim ? '· ' : ''}${escapeHtml(titleTrim)}</span>`;
        }
        s.innerHTML = `
          <div class="cp-top">
            <div class="cp-eyebrow">${leftHeader}</div>
            ${sh.step ? `<div class="cp-step">${escapeHtml(sh.step)}</div>` : ''}
          </div>
          <hr class="cp-rule"/>
          ${bodyHtml}
          <div class="sheet-footer">
            <div class="sf-left"><img src="${LOGO_DATA_URL}"/><span>${escapeHtml(footerBrand)}</span></div>
            <div class="sf-right">Page ${sh.pageNum} of ${total}</div>
          </div>
        `;
      }

      wrap.appendChild(s);
      previewWrap.appendChild(wrap);
    });
  }

  // ---------- PDF Document Builder & Download ----------
  $('generateBtn').addEventListener('click', generatePdf);

  function buildPdfDocument(){
    const { jsPDF } = window.jspdf;
    const deck = buildDeckLayout();
    const total = deck.totalPages;

    const firstSheet = deck.sheets[0];
    const doc = new jsPDF({ unit:'mm', format:'letter', orientation: firstSheet.orientation });

    const docCode = docCodeEl.value.trim() || 'AD-EC-000';
    const docTitle = docTitleEl.value.trim() || 'Untitled Deck';
    const docSubtitle = docSubtitleEl.value.trim();
    const tags = docTagsEl.value.trim();
    const maturity = docMaturityEl.value.trim();

    deck.sheets.forEach((sh, sIdx)=>{
      if (sIdx > 0){
        doc.addPage('letter', sh.orientation);
      }
      const { w: PW, h: PH } = pageSize(sh.orientation);
      drawFooter(doc, PW, PH, MARGIN_X, docCode, docTitle, sh.pageNum, total);

      if (sh.kind === 'cover'){
        drawSafePdfText(doc, docCode, PW / 2, PH * 0.40, {
          font:'helvetica', style:'bold', sizePt: 12, color: BLUE, align:'center'
        });

        applyDocFont(doc, 'helvetica', 'bold', 24);
        const titleLines = doc.splitTextToSize(toWinAnsiFallback(docTitle), PW - MARGIN_X * 2 - 30);
        // Split original docTitle by words into matching lines so Unicode stays intact
        const rawTitleLines = splitDisplayLines(doc, docTitle, PW - MARGIN_X * 2 - 30, 'helvetica', 'bold', 24, INK);
        let ty = PH * 0.40 + 10;
        (rawTitleLines.length ? rawTitleLines : titleLines).forEach(line=>{
          drawSafePdfText(doc, line, PW / 2, ty, {
            font:'helvetica', style:'bold', sizePt: 24, color: INK, align:'center'
          });
          ty += 9.5;
        });

        if (docSubtitle){
          drawSafePdfText(doc, docSubtitle, PW / 2, ty + 3, {
            font:'helvetica', style:'normal', sizePt: 13.5, color: MUTED, align:'center'
          });
          ty += 3;
        }
        if (tags){
          drawSafePdfText(doc, tags, PW / 2, ty + 14, {
            font:'helvetica', style:'normal', sizePt: 9.5, color: MUTED, align:'center'
          });
        }
        if (maturity){
          drawSafePdfText(doc, maturity, PW / 2, ty + 20, {
            font:'helvetica', style:'bold', sizePt: 9.5, color: BLUE, align:'center'
          });
        }
        return;
      }

      const p = sh.card;

      if (sh.kind === 'screenshot'){
        let y = 24;
        if (p.eyebrow){
          drawSafePdfText(doc, (p.eyebrow || '').toUpperCase(), MARGIN_X, y, {
            font:'helvetica', style:'bold', sizePt: 10, color: BLUE, align:'left'
          });
        }
        if (sh.step){
          drawSafePdfText(doc, sh.step, PW - MARGIN_X, y, {
            font:'helvetica', style:'normal', sizePt: 8.5, color: MUTED, align:'right'
          });
        }

        y += 8;
        const shotTitleLines = splitDisplayLines(doc, p.title || '', PW - MARGIN_X * 2, 'helvetica', 'bold', 16.5, INK);
        shotTitleLines.forEach(line=>{
          drawSafePdfText(doc, line, MARGIN_X, y, {
            font:'helvetica', style:'bold', sizePt: 16.5, color: INK, align:'left'
          });
          y += 7;
        });
        y += 2;
        doc.setDrawColor(...LINE);
        doc.setLineWidth(0.3);
        doc.line(MARGIN_X, y, PW - MARGIN_X, y);
        y += 10;

        const footerTop = PH - 26;
        const bottomLimit = footerTop - 6;
        const boxW = PW - MARGIN_X * 2;
        const capLines = p.caption
          ? splitDisplayLines(doc, p.caption, boxW, 'helvetica', 'normal', 9.5, MUTED)
          : [];
        const captionReserve = capLines.length > 0 ? Math.max(16, capLines.length * 4.6 + 7) : 4;
        const boxTop = y;
        const boxBottom = bottomLimit - captionReserve;
        const boxH = Math.max(boxBottom - boxTop, 30);

        doc.setDrawColor(...BOX_BORDER);
        doc.setLineWidth(0.35);
        doc.roundedRect(MARGIN_X, boxTop, boxW, boxH, 2, 2);

        if (p.imgData && p.imgW && p.imgH){
          const pad = 3;
          const availW = boxW - pad * 2;
          const availH = boxH - pad * 2;
          const scale = Math.min(availW / p.imgW, availH / p.imgH);
          const drawW = p.imgW * scale;
          const drawH = p.imgH * scale;
          const ix = MARGIN_X + (boxW - drawW) / 2;
          const iy = boxTop + (boxH - drawH) / 2;
          const fmt = p.imgData.substring(11, p.imgData.indexOf(';')).toUpperCase();
          const imgAlias = 'shot_img_' + (p.id || sh.pageNum);
          try{ doc.addImage(p.imgData, fmt === 'PNG' ? 'PNG' : 'JPEG', ix, iy, drawW, drawH, imgAlias, 'FAST'); }
          catch(e){ try{ doc.addImage(p.imgData, 'JPEG', ix, iy, drawW, drawH, imgAlias, 'FAST'); }catch(e2){} }
        } else {
          doc.setFont('helvetica','normal');
          doc.setFontSize(10);
          doc.setTextColor(190,196,204);
          doc.text('No screenshot uploaded', MARGIN_X + boxW / 2, boxTop + boxH / 2, { align:'center' });
        }

        if (capLines.length > 0){
          let cy = boxBottom + 8;
          capLines.forEach(line=>{
            drawSafePdfText(doc, line, MARGIN_X, cy, {
              font:'helvetica', style:'normal', sizePt: 9.5, color: MUTED, align:'left'
            });
            cy += 4.6;
          });
        }
        return;
      }

      // ---- Text page (Part 1 or Continuation) ----
      const hs = sh.headerSpec;
      if (!sh.isContinuation){
        let y = 24;
        const hasTop = !!(p.eyebrow && p.eyebrow.trim()) || !!sh.step;
        if (p.eyebrow && p.eyebrow.trim()){
          drawSafePdfText(doc, p.eyebrow.trim().toUpperCase(), MARGIN_X, y, {
            font:'helvetica', style:'bold', sizePt: 10, color: BLUE, align:'left'
          });
        }
        if (sh.step){
          drawSafePdfText(doc, sh.step, PW - MARGIN_X, y, {
            font:'helvetica', style:'normal', sizePt: 8.5, color: MUTED, align:'right'
          });
        }
        const titleTrim = (p.title || '').trim();
        if (titleTrim){
          y += hasTop ? 8 : 2;
          const tLines = splitDisplayLines(doc, titleTrim, hs.bodyW, 'helvetica', 'bold', 16.5, INK);
          tLines.forEach(line=>{
            drawSafePdfText(doc, line, MARGIN_X, y, {
              font:'helvetica', style:'bold', sizePt: 16.5, color: INK, align:'left'
            });
            y += 7;
          });
        }
      } else {
        const y = 24;
        const eyebrowTrim = (p.eyebrow || '').trim().toUpperCase();
        const titleTrim = (p.title || '').trim();
        const stepWidth = sh.step ? measureSafeTextWidth(doc, sh.step, 'helvetica', 'normal', 8.5, MUTED) + 6 : 0;
        const maxLeftW = Math.max(40, hs.bodyW - stepWidth);

        let curLeftX = MARGIN_X;
        if (eyebrowTrim){
          drawSafePdfText(doc, eyebrowTrim, curLeftX, y, {
            font:'helvetica', style:'bold', sizePt: 9.5, color: BLUE, align:'left'
          });
          curLeftX += measureSafeTextWidth(doc, eyebrowTrim, 'helvetica', 'bold', 9.5, BLUE) + 2.2;
        }
        if (titleTrim && curLeftX - MARGIN_X < maxLeftW - 12){
          const prefix = eyebrowTrim ? '·  ' : '';
          const remW = maxLeftW - (curLeftX - MARGIN_X);
          const fitted = truncateToWidth(doc, prefix + titleTrim, remW, 'helvetica', 'bold', 9.2, MUTED);
          drawSafePdfText(doc, fitted, curLeftX, y, {
            font:'helvetica', style:'bold', sizePt: 9.2, color: MUTED, align:'left'
          });
        }
        if (sh.step){
          drawSafePdfText(doc, sh.step, PW - MARGIN_X, y, {
            font:'helvetica', style:'normal', sizePt: 8.5, color: MUTED, align:'right'
          });
        }
      }

      doc.setDrawColor(...LINE);
      doc.setLineWidth(0.3);
      doc.line(MARGIN_X, hs.ruleY, PW - MARGIN_X, hs.ruleY);

      replayOpsToPdf(doc, sh.ops, MARGIN_X, hs.bodyStartY);
    });

    return { doc, deck, docCode };
  }

  function splitDisplayLines(doc, str, maxW, font, style, sizePt, color){
    const cleaned = cleanControlChars(str || '');
    if (!cleaned) return [''];
    const words = cleaned.split(/\s+/);
    const lines = [];
    let cur = '';
    for (const wd of words){
      const cand = cur ? cur + ' ' + wd : wd;
      if (cur && measureSafeTextWidth(doc, cand, font, style, sizePt, color) > maxW){
        lines.push(cur);
        cur = wd;
      } else {
        cur = cand;
      }
    }
    if (cur || lines.length === 0) lines.push(cur);
    return lines;
  }

  function truncateToWidth(doc, str, maxW, font, style, sizePt, color){
    const cleaned = cleanControlChars(str || '');
    if (measureSafeTextWidth(doc, cleaned, font, style, sizePt, color) <= maxW) return cleaned;
    const chars = Array.from(cleaned);
    let out = '';
    for (const ch of chars){
      if (measureSafeTextWidth(doc, out + ch + '…', font, style, sizePt, color) > maxW) break;
      out += ch;
    }
    return out + '…';
  }

  function generatePdf(){
    const { doc, docCode } = buildPdfDocument();
    const filename = (docCode || 'deck').replace(/[^a-z0-9\-]+/gi,'_') + '.pdf';
    doc.save(filename);
  }

  function drawFooter(doc, PW, PH, marginX, docCode, docTitle, pageNum, total){
    const fy = PH - 20;
    doc.setDrawColor(...LINE);
    doc.setLineWidth(0.3);
    doc.line(marginX, fy, PW - marginX, fy);
    try{ doc.addImage(LOGO_DATA_URL, 'PNG', marginX, fy + 3.2, 4.6, 4.6, 'adpl_footer_logo', 'FAST'); }catch(e){}
    const pageText = `Page ${pageNum} of ${total}`;
    const pageW = measureSafeTextWidth(doc, pageText, 'helvetica', 'normal', 8.2, MUTED);
    const maxBrandW = Math.max(30, PW - marginX * 2 - 6.5 - pageW - 6);
    const brandText = truncateToWidth(doc, `${docCode} | ${docTitle}`, maxBrandW, 'helvetica', 'bold', 8.2, INK);
    drawSafePdfText(doc, brandText, marginX + 6.5, fy + 6.8, {
      font:'helvetica', style:'bold', sizePt: 8.2, color: INK, align:'left'
    });
    drawSafePdfText(doc, pageText, PW - marginX, fy + 6.8, {
      font:'helvetica', style:'normal', sizePt: 8.2, color: MUTED, align:'right'
    });
  }

  // Expose helper API for diagnostics/testing
  window.ADPLDeck = {
    getPages: () => pages,
    setPages: (next) => { pages = next; renderForm(); renderPreview(); },
    buildDeckLayout,
    buildPdfDocument,
    renderForm,
    renderPreview
  };

  // ---------- init ----------
  renderForm();
  renderPreview();
})();

</script>
